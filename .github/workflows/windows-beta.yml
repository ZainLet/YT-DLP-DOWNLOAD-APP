name: Windows beta · build and test

on:
  push:
    branches: [codex/windows-beta]
    paths:
      - windows/**
      - scripts/windows/**
      - .github/workflows/windows-beta.yml
      - assets/AppIcon.png
      - .gitignore
  pull_request:
    paths:
      - windows/**
      - scripts/windows/**
      - .github/workflows/windows-beta.yml
      - assets/AppIcon.png
      - .gitignore
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-beta:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify build tools
        shell: pwsh
        run: |
          dotnet --info
          if (-not (Test-Path 'C:\msys64\usr\bin\bash.exe')) { throw 'MSYS2 is not available on the Windows runner' }
          & 'C:\msys64\usr\bin\bash.exe' -lc 'pacman --needed --noconfirm -S mingw-w64-x86_64-toolchain make pkgconf xz diffutils'
          if ($LASTEXITCODE -ne 0) { throw 'MSYS2 could not install the pinned-build prerequisites' }
      - name: Build and run .NET core tests
        shell: pwsh
        run: dotnet run --project windows/YTDLPStudio.Tests/YTDLPStudio.Tests.csproj -c Release -- --evidence .build/windows/test-evidence
      - name: Publish self-contained Windows app
        shell: pwsh
        run: dotnet publish windows/YTDLPStudio/YTDLPStudio.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=false -o .build/windows/publish
      - name: Fetch SHA256-locked runtime and source files
        shell: pwsh
        run: ./scripts/windows/prepare-runtime.ps1
      - name: Build static LGPL FFmpeg and FFprobe from source
        shell: pwsh
        run: |
          & 'C:\msys64\usr\bin\bash.exe' -lc 'cd "$(cygpath -u "$1")" && "$2"' _ "$env:GITHUB_WORKSPACE" './scripts/windows/build-ffmpeg.sh'
          if ($LASTEXITCODE -ne 0) { throw 'Static FFmpeg build failed' }
      - name: Run real audio format/conversion tests
        shell: pwsh
        run: dotnet run --project windows/YTDLPStudio.Tests/YTDLPStudio.Tests.csproj -c Release --no-build -- --integration-tools .build/windows/publish/tools --evidence .build/windows/integration
      - name: Bundle sources, licenses, installer and portable build
        shell: pwsh
        run: ./scripts/windows/package.ps1
      - name: Test portable and per-user installer
        shell: pwsh
        run: ./scripts/windows/test-distribution.ps1
      - name: Publish GitHub Windows beta release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/codex/windows-beta'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'windows-v1.3.0-beta.1'
          $files = @(
            ".build/windows/dist/YTDLP-Studio-1.3.0-beta.1-win-x64-Setup.exe",
            ".build/windows/dist/YTDLP-Studio-1.3.0-beta.1-win-x64-Portable.zip",
            ".build/windows/dist/YTDLP-Studio-1.3.0-beta.1-win-x64-ThirdPartySources.zip",
            ".build/windows/dist/SHA256SUMS"
          )
          foreach ($file in $files) { if (!(Test-Path $file)) { throw "Missing release asset: $file" } }
          & gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $tag @files --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            & gh release create $tag @files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'YTDLP Studio 1.3.0-beta.1 · Windows Beta' --notes-file windows/packaging/WINDOWS_BETA.md --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the GitHub Windows beta release' }
      - name: Save build, GUI, install and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: YTDLP-Studio-Windows-Beta-Windows2025
          path: |
            .build/windows/dist/*
            .build/windows/evidence/*
            .build/windows/integration/**/*
            .build/windows/test-evidence/**/*
          if-no-files-found: warn
          retention-days: 30
