name: Publish validated Windows beta

on:
  workflow_run:
    workflows: ["Windows beta · build and test"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: windows-2025
    permissions:
      actions: read
      contents: write
    concurrency:
      group: windows-beta-release
      cancel-in-progress: false
    steps:
      - name: Confirm this is still the latest main build
        id: head
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          $head = gh api "repos/$env:GITHUB_REPOSITORY/branches/main" --jq .commit.sha
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify the main branch head.' }
          if ($head -eq $env:SOURCE_SHA) {
            "current=true" | Add-Content $env:GITHUB_OUTPUT
          } else {
            "current=false" | Add-Content $env:GITHUB_OUTPUT
            Write-Host 'A newer main build exists; this run will not publish stale assets.'
          }
      - name: Download validated build artifacts
        if: steps.head.outputs.current == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run download $env:SOURCE_RUN_ID --name YTDLP-Studio-Windows-Beta-Windows2025 --dir .release --repo $env:GITHUB_REPOSITORY
      - name: Publish immutable Windows beta release
        if: steps.head.outputs.current == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          $version = "1.3.0-beta.$env:SOURCE_RUN_NUMBER"
          $tag = "windows-v$version"
          $patterns = @('*win-x64-Setup.exe', '*win-x64-Portable.zip', '*win-x64-ThirdPartySources.zip', 'SHA256SUMS')
          $assets = @(foreach ($pattern in $patterns) {
            $matches = @(Get-ChildItem .release -Recurse -File | Where-Object Name -like $pattern)
            if ($matches.Count -ne 1) { throw "Expected exactly one asset matching $pattern." }
            $matches[0].FullName
          })
          if ($assets.Count -ne 4) { throw 'Validated release assets are incomplete.' }
          $notes = "YTDLP Studio $version for Windows x64. Built and tested on Windows Server 2025. Unsigned beta; see the repository Windows beta notes for requirements and limitations. Commit: $env:SOURCE_SHA"
          & gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:SOURCE_SHA --title "YTDLP Studio $version · Windows Beta" --notes $notes --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the GitHub Windows beta release.' }
